<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="24" height="24" viewBox="0 0 24 24">
  <!-- Hotspot: pixel (5, 6), the center of the spray. Black with a white outline, as every cursor Easel shows over the canvas (REQ-0029-01). -->
  <defs>
    <g id="figure">
      <rect x="11" y="9" width="9" height="12" rx="1.6"/>
      <rect x="13" y="5.8" width="5" height="3.4" rx="0.6"/>
      <rect x="10.2" y="6.2" width="3.2" height="2.2"/>
      <rect x="4.60" y="5.60" width="1.8" height="1.8"/>
      <rect x="0.90" y="3.30" width="1.8" height="1.8"/>
      <rect x="0.90" y="7.90" width="1.8" height="1.8"/>
      <rect x="4.70" y="1.30" width="1.8" height="1.8"/>
      <rect x="4.70" y="9.90" width="1.8" height="1.8"/>
    </g>
  </defs>
  <use xlink:href="#figure" fill="#ffffff" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
  <use xlink:href="#figure" fill="#000000" stroke="none"/>
  <line x1="11.6" y1="11.6" x2="19.4" y2="11.6" stroke="#ffffff" stroke-width="0.9"/>

</svg>
